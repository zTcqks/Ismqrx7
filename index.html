<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ismqrx7 - AI Chat</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Ismqrx7 AI Chat</h1>
            <button id="themeToggle" class="theme-btn">🌙</button>
        </header>

        <main class="chat-container">
            <div id="chatBox" class="chat-box"></div>
            <div class="input-area">
                <textarea id="messageInput" placeholder="Escribe tu mensaje..."></textarea>
                <div class="action-buttons">
                    <button id="sendBtn" class="btn btn-send">Enviar</button>
                    <button id="voiceBtn" class="btn btn-voice">🎙️</button>
                    <button id="imageBtn" class="btn btn-image">🖼️</button>
                    <button id="searchBtn" class="btn btn-search">🔍</button>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <h3>Historial</h3>
            <div id="historyList" class="history-list"></div>
            <button id="clearHistoryBtn" class="btn btn-danger">Limpiar Historial</button>
        </aside>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/image.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
